<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GZW Field Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0d;
    --bg2: #141510;
    --bg3: #1a1b16;
    --border: rgba(180,160,80,0.18);
    --border2: rgba(180,160,80,0.35);
    --gold: #c8a84b;
    --gold2: #e8c96a;
    --green: #4caf6a;
    --amber: #e8a030;
    --dim: #7a7a68;
    --text: #d8d4c0;
    --text2: #9a9680;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }
  .scanline {
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    z-index: 999;
  }
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border2);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--gold2);
    text-transform: uppercase;
  }
  header p { font-size: 12px; color: var(--dim); letter-spacing: 0.05em; margin-top: 1px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin: 16px 24px;
  }
  .stat {
    background: var(--bg2);
    padding: 12px 16px;
  }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--gold2); font-family: 'Share Tech Mono', monospace; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 16px;
    align-items: center;
  }
  input[type="text"], select {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"] { flex: 1; min-width: 180px; }
  input[type="text"]:focus, select:focus { border-color: var(--gold); }
  input::placeholder { color: var(--dim); }
  select { min-width: 160px; cursor: pointer; }
  select option { background: #1a1b16; }
  .table-wrap { overflow-x: auto; padding: 0 24px 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { border-bottom: 1px solid var(--border2); }
  thead th {
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s;
  }
  thead th:hover { color: var(--gold); }
  thead th.sorted { color: var(--gold2); }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(200,168,75,0.05); }
  td { padding: 8px 10px; color: var(--text); vertical-align: middle; }
  td:first-child { font-weight: 500; }
  .cat-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border: 1px solid;
    white-space: nowrap;
  }
  .price { font-family: 'Share Tech Mono', monospace; font-size: 13px; }
  .p-high { color: var(--green); }
  .p-mid  { color: var(--amber); }
  .p-low  { color: var(--dim); }
  .trader { font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }
  .no-results { text-align: center; padding: 3rem; color: var(--dim); font-size: 16px; letter-spacing: 0.05em; }
  .corner { position: absolute; width: 6px; height: 6px; border-color: var(--gold); border-style: solid; }
  .tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
  .tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
  .bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
  .br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
  .bag-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 3px 9px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .bag-btn:hover { border-color: var(--gold); color: var(--gold); }
  .bag-btn.in-bag { border-color: var(--green); color: var(--green); background: rgba(76,175,106,0.08); }
  .fob-panel { margin: 0 24px 16px; border: 1px solid var(--border2); background: var(--bg2); }
  .fob-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .fob-header:hover { background: rgba(200,168,75,0.04); }
  .fob-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
  .fob-total { font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: 700; color: var(--green); }
  .fob-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .fob-item:last-child { border-bottom: none; }
  .fob-item-name { color: var(--text); flex: 1; }
  .fob-item-price { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--amber); margin: 0 12px; }
  .fob-remove { background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; transition: color 0.1s; }
  .fob-remove:hover { color: #dc5050; }
  .fob-empty { padding: 16px; text-align: center; color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }
  .fob-actions { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .fob-clear { background: transparent; border: 1px solid rgba(220,80,80,0.3); color: rgba(220,80,80,0.6); font-family: 'Rajdhani', sans-serif; font-size: 12px; letter-spacing: 0.08em; padding: 5px 14px; cursor: pointer; transition: all 0.15s; }
  .fob-clear:hover { border-color: #dc5050; color: #dc5050; }
  .qty-btn { background: transparent; border: 1px solid var(--border2); color: var(--dim); font-size: 13px; width: 22px; height: 22px; cursor: pointer; transition: all 0.1s; display:flex;align-items:center;justify-content:center;padding:0; }
  .qty-btn:hover { border-color: var(--gold); color: var(--gold); }
  .item-img { width:32px; height:32px; object-fit:contain; cursor:pointer; transition:transform 0.1s; image-rendering:pixelated; filter:drop-shadow(0 0 2px rgba(0,0,0,0.8)); flex-shrink:0; }
  .item-img:hover { transform:scale(1.15); }
  .img-placeholder { width:32px; height:32px; flex-shrink:0; }
  .img-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; cursor:pointer; }
  .img-modal.open { display:flex; }
  .img-modal img { width:160px; height:160px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 0 12px rgba(200,168,75,0.5)); }
  .img-modal-name { position:fixed; bottom:40%; color:var(--gold2); font-family:'Share Tech Mono',monospace; font-size:13px; letter-spacing:0.1em; text-align:center; }

  .cash-row { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); }
  .cash-label { font-size:10px; letter-spacing:0.12em; color:var(--dim); white-space:nowrap; }
  .cash-input-wrap { display:flex; flex:1; align-items:center; background:var(--bg3); border:1px solid var(--border2); padding:5px 10px; gap:6px; }
  .cash-input-wrap span { font-size:13px; color:var(--gold); }
  .cash-input-wrap input { background:transparent; border:none; outline:none; color:var(--gold2); font-family:'Share Tech Mono',monospace; font-size:13px; width:100%; -moz-appearance:textfield; }
  .cash-input-wrap input::-webkit-outer-spin-button, .cash-input-wrap input::-webkit-inner-spin-button { -webkit-appearance:none; }
  .cash-add { background:transparent; border:1px solid var(--border2); color:var(--gold); font-family:'Share Tech Mono',monospace; font-size:11px; padding:5px 12px; cursor:pointer; letter-spacing:0.08em; white-space:nowrap; transition:all 0.15s; }
  .cash-add:hover { border-color:var(--gold2); color:var(--gold2); }


  .nav-tabs { display:flex; gap:0; border-bottom:1px solid var(--border2); padding: 0 24px; background:var(--bg2); }
  .nav-tab { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; padding:12px 20px; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; transition:all 0.15s; background:transparent; border-top:none; border-left:none; border-right:none; }
  .nav-tab:hover { color:var(--gold); }
  .nav-tab.active { color:var(--gold2); border-bottom-color:var(--gold2); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .keys-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:1px; background:var(--border); margin:16px 24px; }
  .key-card { background:var(--bg2); padding:12px 14px; }
  .key-card:hover { background:var(--bg3); }
  .key-name { font-size:13px; font-weight:700; color:var(--gold2); letter-spacing:0.06em; margin-bottom:4px; }
  .key-desc { font-size:11px; color:var(--dim); line-height:1.5; margin-bottom:8px; }
  .key-tags { display:flex; flex-wrap:wrap; gap:4px; }
  .key-tag { font-size:9px; font-weight:600; letter-spacing:0.1em; padding:2px 7px; border:1px solid; text-transform:uppercase; }
  .tag-static { color:#3cc8b4; border-color:rgba(60,200,180,0.4); background:rgba(60,200,180,0.08); }
  .tag-task { color:#b06ce0; border-color:rgba(160,100,220,0.4); background:rgba(160,100,220,0.08); }
  .tag-location { color:#c8a84b; border-color:rgba(200,168,75,0.35); background:rgba(200,168,75,0.08); }
  .keys-toolbar { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px; align-items:center; }
  .keys-section-title { font-size:10px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); padding:10px 24px 6px; border-bottom:1px solid var(--border); margin-bottom:0; }

  .tasks-list { margin:0 24px 24px; }
  .tasks-trader-section { margin-bottom:2px; }
  .tasks-trader-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--bg2); border:1px solid var(--border2); cursor:pointer; user-select:none; }
  .tasks-trader-header:hover { background:var(--bg3); }
  .tasks-trader-name { font-size:11px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold); }
  .tasks-trader-count { font-size:11px; color:var(--dim); font-family:'Share Tech Mono',monospace; }
  .tasks-trader-body { border:1px solid var(--border); border-top:none; }
  .task-row { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--border); transition:background 0.1s; }
  .task-row:last-child { border-bottom:none; }
  .task-row:hover { background:rgba(200,168,75,0.04); }
  .task-row.done { opacity:0.45; }
  .task-name { font-size:13px; color:var(--text); flex:1; }
  .task-name.done-text { text-decoration:line-through; color:var(--dim); }
  .task-tags { display:flex; gap:6px; align-items:center; margin:0 12px; }
  .tag-ver { font-size:9px; color:var(--dim); font-family:'Share Tech Mono',monospace; letter-spacing:0.08em; }
  .tag-locked { font-size:9px; color:#dc5050; border:1px solid rgba(220,80,80,0.3); padding:1px 6px; letter-spacing:0.06em; }
  .task-check { width:20px; height:20px; border:1px solid var(--border2); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; font-size:12px; color:transparent; }
  .task-check:hover { border-color:var(--gold); }
  .task-check.checked { border-color:var(--green); background:rgba(76,175,106,0.12); color:var(--green); }
  .tasks-toolbar { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px; align-items:center; }
  .tasks-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin:16px 24px; }

</style>
</head>
<body>
<div class="scanline"></div>
<div class="img-modal" id="imgModal" onclick="closeImgModal()"><img id="modalImg" src="" /><div class="img-modal-name" id="modalName"></div></div>

<header>
  <div class="logo-mark">GZW</div>
  <div>
    <h1>Field Intelligence</h1>
    <p>LAMANG ISLAND · OPERATOR COMPANION</p>
  </div>
</header>

<nav class="nav-tabs">
  <button class="nav-tab" onclick="switchTab('loot')">&#9670; Loot</button>
  <button class="nav-tab" onclick="switchTab('keys')">&#9670; Keys</button>
  <button class="nav-tab" onclick="switchTab('tasks')">&#9670; Tasks</button>
</nav>

<div id="tab-loot" class="tab-panel">
<div class="stats" id="stats"></div>


<div class="fob-panel" id="fobPanel">
  <div class="fob-header" onclick="toggleFob()">
    <span class="fob-title">&#9670; FOB Loot Bag <span id="fobCount" style="color:var(--dim);font-weight:400"></span></span>
    <span class="fob-total" id="fobTotal">$0</span>
  </div>
  <div id="fobBody">
    <div class="cash-row">
      <span class="cash-label">USD CASH</span>
      <div class="cash-input-wrap">
        <span>$</span>
        <input type="number" id="cashInput" placeholder="0" min="0" />
      </div>
      <button class="cash-add" onclick="addCash()">+ ADD</button>
    </div>
    <div class="fob-empty" id="fobEmpty">NO ITEMS ADDED &mdash; CLICK + ON ANY ROW TO TRACK LOOT</div>
    <div id="fobList"></div>
    <div class="fob-actions" id="fobActions" style="display:none">
      <button class="fob-clear" onclick="clearBag()">CLEAR ALL</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search items..." />
  <select id="catFilter"><option value="">All categories</option></select>
  <select id="traderFilter">
    <option value="">All traders</option>
    <option value="Gunny">Gunny</option>
    <option value="Turncoat">Turncoat</option>
    <option value="Lab Rat">Lab Rat</option>
    <option value="Artisan">Artisan</option>
    <option value="—">No trader</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('category')">Category</th>
        <th onclick="sortBy('size')">Size</th>
        <th onclick="sortBy('weight')">Weight</th>
        <th onclick="sortBy('price')" class="sorted">Sell Price</th>
        <th onclick="sortBy('pricePerSlot')">Price / Slot</th>
        <th onclick="sortBy('trader')">Sell At</th>
        <th>Bag</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="noResults" class="no-results" style="display:none;">NO ITEMS MATCH YOUR FILTERS</div>
</div>

function badge(cat) {

// bag stores { price, qty, isCash? } per item name
const bag = new Map();

window.addCash = function() {
  const input = document.getElementById('cashInput');
  const amount = parseInt(input.value);
  if (!amount || amount <= 0) return;
  const key = 'USD Cash';
  if (bag.has(key)) {
    const entry = bag.get(key);
    bag.set(key, { ...entry, price: entry.price + amount });
  } else {
    bag.set(key, { price: amount, qty: 1, isCash: true });
  }
  input.value = '';
  renderBag();
  render();
};

// allow pressing Enter on cash input
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('cashInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCash();
  });
});

window.toggleBag = function(name, price) {
  if (bag.has(name)) {
    bag.delete(name);
  } else {
    bag.set(name, { price, qty: 1 });
  }
  renderBag();
  render();
};

window.setBagQty = function(name, delta) {
  if (!bag.has(name)) return;
  const entry = bag.get(name);
  const newQty = entry.qty + delta;
  if (newQty <= 0) { bag.delete(name); }
  else { bag.set(name, { ...entry, qty: newQty }); }
  renderBag();
  render();
};

window.clearBag = function() {
  bag.clear();
  renderBag();
  render();
};

window.toggleFob = function() {
  const body = document.getElementById('fobBody');
  body.style.display = body.style.display === 'none' ? '' : 'none';
};

function renderBag() {
  const list = document.getElementById('fobList');
  const empty = document.getElementById('fobEmpty');
  const actions = document.getElementById('fobActions');
  const total = [...bag.values()].reduce((s, v) => s + (v.isCash ? v.price : v.price * v.qty), 0);
  const totalItems = [...bag.values()].reduce((s, v) => s + (v.isCash ? 1 : v.qty), 0);
  document.getElementById('fobTotal').textContent = '$' + total.toLocaleString();
  document.getElementById('fobCount').textContent = bag.size ? '(' + totalItems + ' item' + (totalItems !== 1 ? 's' : '') + ')' : '';
  if (!bag.size) {
    list.innerHTML = '';
    empty.style.display = 'block';
    actions.style.display = 'none';
  } else {
    empty.style.display = 'none';
    actions.style.display = 'flex';
    list.innerHTML = [...bag.entries()].map(([name, {price, qty, isCash}]) => {
      const safeName = name.replace(/'/g, "\\'");
      const displayPrice = isCash ? price : price * qty;
      const qtyControls = isCash
        ? `<span style="font-size:10px;letter-spacing:0.08em;color:var(--dim);margin:0 10px">CASH</span>`
        : `<span style="display:flex;align-items:center;gap:6px;margin:0 10px">
            <button class="qty-btn" onclick="setBagQty('${safeName}',-1)">&#8722;</button>
            <span style="font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--gold2);min-width:18px;text-align:center">${qty}</span>
            <button class="qty-btn" onclick="setBagQty('${safeName}',1)">&#43;</button>
           </span>`;
      return `<div class="fob-item">
        <span class="fob-item-name">${name}</span>
        ${qtyControls}
        <span class="fob-item-price">$${displayPrice.toLocaleString()}</span>
        <button class="fob-remove" onclick="toggleBag('${safeName}',${price})">&#215;</button>
      </div>`;
    }).join('');
  }
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const trader = document.getElementById('traderFilter').value;

  let filtered = items.filter(i => {
    if (search && !i.name.toLowerCase().includes(search) && !i.category.toLowerCase().includes(search)) return false;
    if (cat && i.category !== cat) return false;
    if (trader && i.trader !== trader) return false;
    return true;
  });

  filtered.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av === null) av = sortDir === 1 ? Infinity : -Infinity;
    if (bv === null) bv = sortDir === 1 ? Infinity : -Infinity;
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });

  const tbody = document.getElementById('tableBody');
  const noRes = document.getElementById('noResults');

  if (!filtered.length) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
  } else {
    noRes.style.display = 'none';
    tbody.innerHTML = filtered.map(i => {
      const wt = i.weight !== null ? i.weight.toFixed(3) + ' kg' : '???';
      const pc = i.price >= 5000 ? 'p-high' : i.price >= 1000 ? 'p-mid' : 'p-low';
      const inBag = bag.has(i.name);
      const bagEntry = inBag ? bag.get(i.name) : null;
      return `<tr>
        <td style="display:flex;align-items:center;gap:8px;">${i.img ? `<img class="item-img" src="${i.img}" alt="${i.name}" onclick="openImgModal('${i.img.replace(/'/g,"\\'")}','${i.name.replace(/'/g,"\\'")}');event.stopPropagation();" onerror="this.style.display='none'"/>` : '<div class=\"img-placeholder\"></div>'} ${i.name}</td>
        <td>${badge(i.category)}</td>
        <td style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)">${i.size}</td>
        <td style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)">${wt}</td>
        <td class="price ${pc}">$${i.price.toLocaleString()}</td>
        <td class="price" style="color:var(--gold2)">$${i.pricePerSlot.toLocaleString()}</td>
        <td class="trader">${i.trader}</td>
        <td><button class="bag-btn ${inBag ? 'in-bag' : ''}" onclick="toggleBag('${i.name.replace(/'/g, "\\'")}',${i.price})">${inBag ? '&#10003;&nbsp;' + bagEntry.qty : '+'}</button></td>
      </tr>`;
    }).join('');
  }

  const total = filtered.reduce((s, i) => s + i.price, 0);
  const top = filtered.length ? [...filtered].sort((a,b) => b.price - a.price)[0].price : 0;
  const avg = filtered.length ? Math.round(total / filtered.length) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Items</div><div class="stat-value">${filtered.length}</div></div>
    <div class="stat"><div class="stat-label">Total value</div><div class="stat-value">$${total.toLocaleString()}</div></div>
    <div class="stat"><div class="stat-label">Top item</div><div class="stat-value">$${top.toLocaleString()}</div></div>
    <div class="stat"><div class="stat-label">Avg price</div><div class="stat-value">$${avg.toLocaleString()}</div></div>
  `;
}

window.sortBy = function(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = (key === 'price' || key === 'pricePerSlot') ? -1 : 1; }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  render();
};

document.getElementById('search').addEventListener('input', render);
document.getElementById('catFilter').addEventListener('change', render);
document.getElementById('traderFilter').addEventListener('change', render);
</script>

function filterKeys() {
  const search = document.getElementById('keySearch').value.toLowerCase();
  const loc = document.getElementById('keyLocation').value;
  const type = document.getElementById('keyFilter').value;
  const grid = document.getElementById('keysGrid');
  const noRes = document.getElementById('keysNoResults');
  const filtered = keysData.filter(k => {
    if (search && !k.name.toLowerCase().includes(search) && !k.desc.toLowerCase().includes(search) && !k.location.toLowerCase().includes(search)) return false;
    if (loc && k.location !== loc) return false;
    if (type === 'static' && !k.static) return false;
    if (type === 'task' && !k.task) return false;
    return true;
  });
  if (!filtered.length) { grid.innerHTML=''; noRes.style.display='block'; return; }
  noRes.style.display='none';
  grid.innerHTML = filtered.map(k => {
    const tags = [];
    if (k.static) tags.push('<span class="key-tag tag-static">Static Spawn</span>');
    if (k.task) tags.push('<span class="key-tag tag-task">Task</span>');
    tags.push('<span class="key-tag tag-location">' + k.location + '</span>');
    return '<div class="key-card"><div class="key-name">' + k.name + '</div><div class="key-desc">' + k.desc + '</div><div class="key-tags">' + tags.join('') + '</div></div>';
  }).join('');
}
filterKeys();

const taskDone = new Set(JSON.parse(localStorage.getItem('gzw_tasks') || '[]'));

function saveTasks() { localStorage.setItem('gzw_tasks', JSON.stringify([...taskDone])); }

window.toggleTask = function(key) {
  if (taskDone.has(key)) taskDone.delete(key); else taskDone.add(key);
  saveTasks(); filterTasks();
};

window.clearAllTasks = function() {
  if (confirm('Reset all task progress?')) { taskDone.clear(); saveTasks(); filterTasks(); }
};

function filterTasks() {
  const search = document.getElementById('taskSearch').value.toLowerCase();
  const trader = document.getElementById('taskTrader').value;
  const status = document.getElementById('taskStatus').value;
  const list = document.getElementById('tasksList');
  let totalAll = 0, totalDone = 0, html = '';

  Object.entries(tasksData).forEach(([traderName, tasks]) => {
    if (trader && traderName !== trader) return;
    const filtered = tasks.filter(t => {
      if (search && !t.n.toLowerCase().includes(search)) return false;
      const done = taskDone.has(traderName + ':' + t.n);
      if (status === 'done' && !done) return false;
      if (status === 'todo' && done) return false;
      return true;
    });
    if (!filtered.length) return;
    totalAll += filtered.length;
    const doneCount = filtered.filter(t => taskDone.has(traderName + ':' + t.n)).length;
    totalDone += doneCount;
    html += '<div class="tasks-trader-section">';
    html += '<div class="tasks-trader-header"><span class="tasks-trader-name">&#9670; ' + traderName + '</span><span class="tasks-trader-count">' + doneCount + ' / ' + filtered.length + '</span></div>';
    html += '<div class="tasks-trader-body">';
    filtered.forEach(t => {
      const key = traderName + ':' + t.n;
      const done = taskDone.has(key);
      const tags = [];
      if (t.v) tags.push('<span class="tag-ver">v' + t.v + '</span>');
      if (t.locked) tags.push('<span class="tag-locked">LOCKED</span>');
      html += '<div class="task-row' + (done ? ' done' : '') + '">';
      html += '<span class="task-name' + (done ? ' done-text' : '') + '">' + t.n + '</span>';
      html += '<span class="task-tags">' + tags.join('') + '</span>';
      html += '<button class="task-check' + (done ? ' checked' : '') + '" onclick="toggleTask(' + JSON.stringify(key) + ')">' + (done ? '&#10003;' : '') + '</button>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  list.innerHTML = html || '<div class="no-results" style="padding:3rem;text-align:center;color:var(--dim);">NO TASKS MATCH YOUR FILTERS</div>';

  const pct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
  document.getElementById('taskStats').innerHTML =
    '<div class="stat"><div class="stat-label">Total Tasks</div><div class="stat-value">' + totalAll + '</div></div>' +
    '<div class="stat"><div class="stat-label">Completed</div><div class="stat-value" style="color:var(--green)">' + totalDone + '</div></div>' +
    '<div class="stat"><div class="stat-label">Remaining</div><div class="stat-value" style="color:var(--amber)">' + (totalAll - totalDone) + '</div></div>' +
    '<div class="stat"><div class="stat-label">Progress</div><div class="stat-value">' + pct + '%</div></div>';
}
filterTasks();

// Wire up event listeners after DOM ready
document.addEventListener('DOMContentLoaded', function() {
  // Keys listeners
  var ks = document.getElementById('keySearch');
  var kl = document.getElementById('keyLocation');
  var kf = document.getElementById('keyFilter');
  if(ks) ks.addEventListener('input', filterKeys);
  if(kl) kl.addEventListener('change', filterKeys);
  if(kf) kf.addEventListener('change', filterKeys);
  
  // Tasks listeners
  var ts = document.getElementById('taskSearch');
  var tt = document.getElementById('taskTrader');
  var tst = document.getElementById('taskStatus');
  if(ts) ts.addEventListener('input', filterTasks);
  if(tt) tt.addEventListener('change', filterTasks);
  if(tst) tst.addEventListener('change', filterTasks);

  // Initial renders
  filterKeys();
  filterTasks();
  render();
});
